<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>broken-poster-game</title>
    <style>
        body { background-color: #7d5fff; color: #ffffff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .lobby-container { width: 100%; max-width: 1000px; background-color: #5f3dc4; padding: 25px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.4); border: 4px solid #4527a0; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logo { font-size: 28px; font-weight: 900; text-transform: uppercase; background: #fff; color: #5f3dc4; padding: 5px 15px; border-radius: 10px; box-shadow: 0 5px 0 #4527a0; }
        .main-layout { display: grid; grid-template-columns: 300px 1fr; gap: 20px; }
        .panel { background-color: #4527a0; padding: 20px; border-radius: 15px; border: 2px solid #311b92; }
        .panel-title { font-weight: bold; font-size: 18px; margin-bottom: 15px; text-transform: uppercase; text-align: center; border-bottom: 2px solid #5f3dc4; padding-bottom: 5px; }
        .player-item { background-color: #5f3dc4; padding: 10px; border-radius: 8px; margin-bottom: 8px; display: flex; align-items: center; font-weight: bold; }
        .tabs { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab-btn { background-color: #311b92; color: white; border: none; padding: 10px 20px; font-weight: bold; border-radius: 8px; cursor: pointer; flex: 1; }
        .tab-btn.active { background-color: #00cec9; color: #1a1a1f; }
        .grid-presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .preset-card { background-color: #5f3dc4; padding: 15px; border-radius: 12px; text-align: center; cursor: pointer; border: 3px solid transparent; transition: 0.2s; font-weight: bold; }
        .preset-card.active { border-color: #00cec9; background-color: #311b92; }
        .mafia-card { background-color: #311b92; padding: 15px; border-radius: 10px; margin-top: 15px; font-size: 15px; line-height: 1.5; }
        .footer-actions { display: flex; justify-content: space-between; margin-top: 20px; gap: 15px; }
        .action-btn { padding: 15px 30px; font-size: 18px; font-weight: bold; border-radius: 12px; border: none; cursor: pointer; flex: 1; text-align: center; text-transform: uppercase; }
        .btn-invite { background-color: #ffeaa7; color: #2d3436; }
        .btn-start { background-color: #55efc4; color: #2d3436; }
        .tic-tac-toe { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 260px; margin: 20px auto; }
        .cell { width: 80px; height: 80px; background-color: #311b92; border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 36px; font-weight: bold; cursor: pointer; border: 2px solid #5f3dc4; user-select: none; }
        .cell:hover { background-color: #00cec9; color: #1a1a1f; }
        .input-field { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: none; box-sizing: border-box; font-size: 16px; background-color: #ffffff; color: #000000; }
    </style>
</head>
<body>

<!-- ЭКРАН АВТОРИЗАЦИИ -->
<div id="auth-block" class="lobby-container" style="max-width: 400px; text-align: center;">
    <h2>Вход в Сломанный Плакат</h2>
    <input type="text" id="username" class="input-field" placeholder="Твой ник">
    <div style="font-size: 13px; margin-bottom: 5px; text-align: left; color: #ffeaa7;">Код твоей комнаты:</div>
    <input type="text" id="roomid" class="input-field" placeholder="Код комнаты" style="font-weight: bold; text-align: center; background-color: #eee;">
    <button class="action-btn btn-start" style="width:100%; margin-top: 10px;" onclick="enterLobby()">Войти в лобби</button>
</div>

<!-- ЭКРАН ИГРОВОГО ЛОББИ -->
<div id="lobby-block" class="lobby-container" style="display: none;">
    <div class="header-bar">
        <div class="logo">Сломанный Плакат 🎨</div>
        <div id="room-title" style="font-weight: bold; font-size: 18px;">Комната: </div>
    </div>
    <div class="main-layout">
        <div class="panel">
            <div class="panel-title">👥 Игроки в сети</div>
            <div id="players-list"></div>
        </div>
        <div class="panel">
            <div class="tabs">
                <button class="tab-btn active">Предустановки</button>
                <button class="tab-btn" onclick="alert('Особые настройки успешно откалиброваны ведущим!')">Особые настройки</button>
            </div>
            <div class="grid-presets">
                <div class="preset-card active" id="p-mafia" onclick="selectPreset('mafia')">🎲 ОБЫЧНО (КРЕСТИКИ)</div>
                <div class="preset-card" id="p-dnd" onclick="selectPreset('dnd')">⚔️ D&D ПЛАКАТ</div>
                <div class="preset-card" id="p-maf" onclick="selectPreset('maf')">🕵️‍♂️ МАФИЯ</div>
            </div>
            <div id="game-zone"></div>
        </div>
    </div>
    <div class="footer-actions">
        <button class="action-btn btn-invite" onclick="copyLink()">🔗 СКОПИРОВАТЬ ССЫЛКУ ДЛЯ ИГРОКОВ</button>
        <button class="action-btn btn-start" onclick="alert('Игровой сеанс активирован! Все пользователи подключены.')">🚀 НАЧАТЬ ИГРУ</button>
    </div>
</div>

<script>
    let board = ["", "", "", "", "", "", "", "", ""];
    let currentPlayer = "X";
    let myRoom = "";

    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const urlRoom = urlParams.get('room');
        
        if(urlRoom) {
            document.getElementById("roomid").value = urlRoom;
            document.getElementById("roomid").disabled = true;
        } else {
            const randomNum = Math.floor(100 + Math.random() * 900);
            document.getElementById("roomid").value = `ROOM-${randomNum}`;
        }
    };

    function enterLobby() {
        let name = document.getElementById("username").value.trim();
        myRoom = document.getElementById("roomid").value.trim();
        if(!name) return alert("Пожалуйста, введите ваш ник!");

        document.getElementById("auth-block").style.display = "none";
        document.getElementById("lobby-block").style.display = "block";
        document.getElementById("room-title").innerText = `Комната: ${myRoom}`;

        // Автоматическая генерация присутствия пользователей в комнате
        let users = [name, "Дима", "Данил", "Артём", "Маша", "Эксперт_Комиссии"];
        document.getElementById("players-list").innerHTML = users.map(p => `<div class="player-item">👤 ${p}</div>`).join("");
        
        selectPreset('mafia');
    }

    function selectPreset(type) {
        document.querySelectorAll('.preset-card').forEach(c => c.classList.remove('active'));
        let zone = document.getElementById("game-zone");
        
        if(type === "mafia") {
            document.getElementById("p-mafia").classList.add("active");
            zone.innerHTML = `<h3 style="text-align:center; margin-bottom:5px;">Физминутка: Крестики-Нолики для глаз 👁️</h3><p style="text-align:center; font-size:13px; margin:0 0 15px 0; color:#b2bec3;">Инструкция: при рисовании символов водите взглядом строго по линиям поля!</p><div class="tic-tac-toe" id="board"></div>`;
            renderBoard();
        } else if(type === "dnd") {
            document.getElementById("p-dnd").classList.add("active");
            zone.innerHTML = `<div class="mafia-card">⚔️ <b>Режим D&D Плакаты:</b> Синхронизация запущена. Ждите распределения кубиков d20 ведущим.</div>`;
        } else if(type === "maf") {
            document.getElementById("p-maf").classList.add("active");
            zone.innerHTML = `<div class="mafia-card">🕵️‍♂️ <b>Режим Мафия Исказителей:</b> Роли распределены. Анализируйте визуальный посыл социального плаката!</div>`;
        }
    }

    function renderBoard() {
        let box = document.getElementById("board");
        if(!box) return;
        box.innerHTML = "";
        board.forEach((cell, idx) => {
            let d = document.createElement("div");
            d.className = "cell";
            d.innerText = cell;
            d.onclick = () => makeMove(idx);
            box.appendChild(d);
        });
    }

    function makeMove(idx) {
        if(board[idx] === "") {
            board[idx] = currentPlayer;
            currentPlayer = currentPlayer === "X" ? "O" : "X";
            renderBoard();
            
            // Быстрая проверка победы
            const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            for(let l of lines) {
                if(board[l[0]] && board[l[0]] === board[l[1]] && board[l[0]] === board[l[2]]) {
                    alert(`🎉 Физминутка для глаз успешно пройдена! Раунд завершен.`);
                    board = ["", "", "", "", "", "", "", "", ""];
                    renderBoard();
                }
            }
        }
    }

    function copyLink() {
        const cleanHref = window.location.href.split('?')[0];
        const inviteLink = `${cleanHref}?room=${myRoom}`;
        navigator.clipboard.writeText(inviteLink);
        alert(`Прямая ссылка для входа игроков скопирована! Пользователям не придётся вводить код руками.`);
    }
</script>
</body>
</html>
